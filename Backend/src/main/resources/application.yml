Spring:
    aplication:
        name: GestorWeb
server:
    port: 8080
    servlet:
        context-path: /apli
    compression:
        enabled: true
        min-response-size: 2048
        mime-types: application/json,application/xml,text/html,text/plain

management:
  info:
    env:
      enabled: true
    endpoint:
      health:
        show-details: always
  endpoints:
    web:
      base-path: /
      exposure:
        include: "*"

spring:
    datasource:
        url: jdbc:mysql://localhost:3306/app_db
        username: root
        password: root
        driver-class-name: com.mysql.cj.jdbc.Driver